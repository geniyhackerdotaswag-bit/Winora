# Builds the portable Winora and publishes it, on a tag and only on a tag.
#
# The tag is the only source of the version: it reaches the build as -p:Version and ends up inside
# the executable, where the update check reads it back. Nothing here uses a token belonging to a
# person — GITHUB_TOKEN is issued for the length of this run and expires with it.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Pinned to commit SHAs, not tags. With no code signing, HTTPS to GitHub is the trust anchor
      # (see the design spec's section 7) -- which makes these actions themselves part of that
      # provenance. A mutable tag can be repointed by whoever controls it, and because the checksum
      # published alongside the release is produced by this same run, it would verify the substitute
      # perfectly. The version each SHA resolves to today is in the trailing comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # The tag is written v0.4.0; the version inside the build is not.
      - name: Read the version out of the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test
        run: dotnet test --nologo

      - name: Publish
        run: >
          dotnet publish src/Winora.App/Winora.App.csproj
          -c Release
          -p:WinoraPortable=true
          -p:Platform=x64
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # No rename here, and that is the point. WinUI resolves its resource map — which is where
      # compiled XAML lives — by the running module's name, so a published file renamed after the
      # build dies at startup with a stowed WinRT exception before anything can report it. Measured
      # on 2026-08-24: identical bytes named Winora.exe, Winora2.exe and WinoraApp.exe all died;
      # only the name the build produced started. The project now builds as Winora.exe directly.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Winora.exe -Algorithm SHA256).Hash
          "$hash  Winora.exe" | Out-File publish/Winora.exe.sha256 -Encoding ascii -NoNewline

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            publish/Winora.exe
            publish/Winora.exe.sha256
          generate_release_notes: true
